<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoopScholar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Hoop<span>Scholar</span></a>
    <nav>
      <a href="#/" data-nav="home">Leaderboards</a>
      <a href="#/games" data-nav="games">Games</a>
    </nav>
    <div class="search">
      <!-- Phones: the search collapses to this button (see styles.css) -->
      <button class="search-toggle" type="button" aria-label="Search players or teams" aria-expanded="false" aria-controls="search">
        <svg class="i-search" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <svg class="i-close" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <input id="search" type="search" placeholder="Search players or teams  ( / )" autocomplete="off" aria-label="Search players or teams">
      <ul id="search-results" class="search-results" hidden></ul>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="band"></div>
  <main id="app"><p class="muted">Loading…</p></main>
  <footer class="foot">
    Data: NBA.com via nba_api. Not affiliated with or endorsed by the NBA.
    <span id="updated"></span>
  </footer>
  <script src="/static/games.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
