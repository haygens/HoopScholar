# Used by Vercel to install the website's runtime libraries and find the app.
# For local development (data pulls, notebook, tests) use requirements.txt.
[project]
name = "hoopscholar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pandas>=2.0",
    "numpy>=1.26",
    "libsql>=0.1.11,<0.2",   # only imported when HOOP_DB_BACKEND is libsql or turso
]

[tool.vercel]
entrypoint = "api.main:app"
